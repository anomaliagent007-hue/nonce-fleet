name: NONCE SAT Race

on:
  push:
    paths:
      - 'instance4.cnf'
  workflow_dispatch:
    inputs:
      deadline_sec:
        description: Solver deadline seconds
        required: false
        default: '870'

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        solver: [cadical, kissat, nonceflow, fps]
    steps:
      - uses: actions/checkout@v4

      - name: Unpack solvers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils
          for f in *.xz; do [ -e "$f" ] && xz -dkf "$f"; done
          chmod +x cadical kissat nonceflow fps 2>/dev/null || true
          ls -la cadical kissat nonceflow fps 2>/dev/null || true
          nproc

      - name: Solve
        run: |
          DEADLINE="${{ github.event.inputs.deadline_sec }}"
          DEADLINE="${DEADLINE:-870}"
          SOLVER="${{ matrix.solver }}"
          echo "solver=$SOLVER deadline=${DEADLINE}s"
          head -1 instance4.cnf
          set +e
          case "$SOLVER" in
            cadical)   timeout "$DEADLINE" ./cadical instance4.cnf > solver_out.txt 2>&1 ;;
            kissat)    timeout "$DEADLINE" ./kissat instance4.cnf > solver_out.txt 2>&1 ;;
            nonceflow) timeout "$DEADLINE" ./nonceflow instance4.cnf "$DEADLINE" bits_nonflow.txt > solver_out.txt 2>&1 ;;
            fps)       timeout "$DEADLINE" ./fps instance4.cnf bits_fps.txt "$DEADLINE" > solver_out.txt 2>&1 ;;
          esac
          echo "RC=$?"
          tail -5 solver_out.txt 2>/dev/null || true

      - name: Extract bits
        run: python3 tools.py extract ${{ matrix.solver }} instance4.cnf

      - name: Verify assignment
        if: always()
        run: python3 tools.py verify instance4.cnf winner_bits.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-${{ matrix.solver }}
          path: |
            winner_bits.txt
            result.txt
            verify.txt
            solver_out.txt
          retention-days: 7
          if-no-files-found: warn